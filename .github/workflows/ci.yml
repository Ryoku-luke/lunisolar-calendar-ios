name: CI

# 触发：main 分支的推送与 PR。按总方案 §49 接 CI，替代 README 里「未配置 CI」的状态。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 门禁：与本地开发工具链对齐。首次 CI（2026-09-27，8233ca8）用 macos-15，该镜像默认
  # Xcode 只有 16.4（Swift 6.1），在那个工具链上 `swift build` 就失败（两处
  # UserNotifications 的 "non-sendable result type ... cannot be sent"，见提交 4a1330b）。
  # 当时本机是 Xcode 27，看不到这个报错——所以 CI 与开发工具链必须对齐，改用 macos-26。
  # （旧工具链是否仍可编译：2026-09-28 用一次性探针 job 在 macos-15 上验过一次，
  #  加 @preconcurrency 后通过；探针已删除，结论记在 README 的系统要求一节。）
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: 打印工具链版本
        run: |
          xcodebuild -version
          swift --version
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-path)"

      # 本项目验证 = 四通道串行（Tools/run_tests.sh 的纪律：两个 xcodebuild 并行会互相干扰）。
      # CI 上跑前三条（编译 + 单测 + iOS SDK 构建）；UI 测试（双端模拟器）在 runner 上
      # 慢且偶发不稳定，保留给本地 run_tests.sh 全量跑。
      #
      # 三条都经 Tools/ci_run_channel.sh 跑：完整日志落盘，失败时把编译错误发布成
      # ::error:: 注解——Actions 日志现在要登录才能看，注解是公开可读的。
      - name: swift build（macOS 宿主）
        run: Tools/ci_run_channel.sh macos swift build

      # 单测按 4 个时区各跑一遍。理由见 Tests/.../TimeZoneGoldenTests.swift 的类注释：
      # 日期边界的测试必须跨时区自证——本项目刚踩过「用例只在本机时区（Asia/Shanghai）下通过」
      # 的坑，runner 是 UTC，一上来就红。每个时区单独一条通道，失败时注解里直接能看出是哪个时区。
      - name: 单元测试（swift test，四个时区各跑一遍）
        run: |
          for tz in Asia/Shanghai UTC America/New_York Pacific/Auckland; do
            Tools/ci_run_channel.sh "unit-${tz//\//-}" env TZ="$tz" swift test
          done

      - name: iOS SDK 构建（视图层与宿主编译）
        run: |
          Tools/ci_run_channel.sh ios-sdk \
            swift build \
              --triple arm64-apple-ios17.0-simulator \
              --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"

  # N-9：硬编码字号红线。动态字号是 iOS 无障碍基础——新代码不得再直接写
  # `font(.system(size:))`。允许三处例外（均显式豁免，收编意义低）：
  #   1. AppTheme.swift 本身（token 的唯一合法出处）；
  #   2. Widgets/ 目录（小组件画布像素固定，Dynamic Type 不生效）；
  #   3. 同行带 `N-9-exempt:` 注释（网格密度固定的迷你图等）。
  # 触碰红线的 PR 在 CI 直接失败，开发者需改为 AppTheme token 或补豁免注释。
  hardcoded-font-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 检测未豁免的硬编码字号
        run: |
          set -euo pipefail
          # 排除 AppTheme.swift 与 Widgets/ 目录，再剔除带豁免注释的行；
          # 剩余命中即违规（-n 输出文件名:行号，::error:: 标注到 CI 日志）。
          mapfile -t hits < <(
            grep -rn --include='*.swift' '\.system(size:' Sources/ \
              | grep -v 'Support/AppTheme.swift' \
              | grep -v 'Widgets/' \
              | grep -v 'N-9-exempt:' || true
          )
          if [ "${#hits[@]}" -gt 0 ]; then
            for h in "${hits[@]}"; do
              echo "::error file=${h%%:*},line=${h#*:}::未豁免的硬编码字号（改用 AppTheme.Font 或加 N-9-exempt: 注释）"
              echo "$h"
            done
            exit 1
          fi
          echo "硬编码字号红线通过"
