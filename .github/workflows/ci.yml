name: CI

# 触发：main 分支的推送与 PR。按总方案 §49 接 CI，替代 README 里「未配置 CI」的状态。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 门禁：与本地开发工具链对齐。首次 CI（2026-09-27，8233ca8）用的是 macos-15，
  # 而该镜像默认 Xcode 只有 16.4（Swift 6.1），远低于本项目开发用的 Xcode 27；
  # 同一个 commit 在本机干净克隆下三通道全过，所以失败点是工具链不是代码内容。
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: 打印工具链版本
        run: |
          xcodebuild -version
          swift --version
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-path)"

      # 本项目验证 = 四通道串行（Tools/run_tests.sh 的纪律：两个 xcodebuild 并行会互相干扰）。
      # CI 上跑前三条（编译 + 单测 + iOS SDK 构建）；UI 测试（双端模拟器）在 runner 上
      # 慢且偶发不稳定，保留给本地 run_tests.sh 全量跑。
      #
      # 三条都经 Tools/ci_run_channel.sh 跑：完整日志落盘，失败时把编译错误发布成
      # ::error:: 注解——Actions 日志现在要登录才能看，注解是公开可读的。
      - name: swift build（macOS 宿主）
        run: Tools/ci_run_channel.sh macos swift build

      # 单测按 4 个时区各跑一遍。理由见 Tests/.../TimeZoneGoldenTests.swift 的类注释：
      # 日期边界的测试必须跨时区自证——本项目刚踩过「用例只在本机时区（Asia/Shanghai）下通过」
      # 的坑，runner 是 UTC，一上来就红。每个时区单独一条通道，失败时注解里直接能看出是哪个时区。
      - name: 单元测试（swift test，四个时区各跑一遍）
        run: |
          for tz in Asia/Shanghai UTC America/New_York Pacific/Auckland; do
            Tools/ci_run_channel.sh "unit-${tz//\//-}" env TZ="$tz" swift test
          done

      - name: iOS SDK 构建（视图层与宿主编译）
        run: |
          Tools/ci_run_channel.sh ios-sdk \
            swift build \
              --triple arm64-apple-ios17.0-simulator \
              --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"

  # 工具链探针：README 目前声明「Swift 6.0 / Xcode 16.0+」，但首次 CI 在 Xcode 16.4 上
  # swift build 就失败了。这个 job 固定跑旧工具链，用注解把真实报错暴露出来，
  # 好判定 README 的兼容声明是否成立。continue-on-error 让它不拖垮整轮结果。
  # 结论落地（改 README 或改代码）后即可删除本 job。
  toolchain-probe:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: 打印工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: swift build（旧工具链探针）
        run: Tools/ci_run_channel.sh probe-macos15 swift build
