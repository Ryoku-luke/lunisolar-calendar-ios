name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

# 项目为纯 iOS App：UI 视图使用 topBarLeading / insetGrouped / navigationBarTitleDisplayMode
# 等 iOS-only API，SwiftPM 在 macOS 上会编译失败。CI 只在 Linux 容器内跑 SwiftPM 单测，
# iOS 端 UI/Widget 依赖 Xcode + 模拟器，由开发者本地 Xcode 验证，不进 CI。
jobs:
  linux-tests:
    name: SwiftPM 单测（Linux）
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

