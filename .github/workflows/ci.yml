name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:
  linux-tests:
    name: Linux · SwiftPM 单测
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios-tests:
    name: iOS · xcodebuild 单测（模拟器）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 版本
        run: xcodebuild -version
      - name: Build & Test
        run: |
          xcodebuild test \
            -project LunisolarCalendar.xcodeproj \
            -scheme LunisolarCalendar \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            -quiet
      - name: 上传测试产物（失败时可查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: DerivedData/Logs/Test/
          if-no-files-found: ignore
