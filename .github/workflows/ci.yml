name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:
  linux-tests:
    name: Linux · SwiftPM 单测
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios-tests:
    name: iOS · SwiftPM 单测（macOS runner）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift 版本
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        # 项目测试用例全部为纯逻辑测试（无 UI/WidgetKit 依赖），
        # SwiftPM 测试 target 由 Package.swift 声明，不需要 xcodeproj 测试 target。
        # macOS runner 上 swift test 会用本机 XCTest 运行所有 LunisolarCalendarTests 用例。
        run: swift test
