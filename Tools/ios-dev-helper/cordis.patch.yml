# Bundle patch for ios-dev-helper.
#
# A bundle patch is a top-level YAML array of Loader patch entries. A plugin row
# must sit inside an `insert:` block — a row written at the top level is read as
# an id-targeted *override* of an existing entry and inserts nothing.
#
# `install_bundle` selects this bundle in the active profile, and the Loader
# applies these rows after the shipped bundle layers. Every config field below
# is optional: the plugin falls back to the documented defaults when a key is
# absent, so tune or delete them to taste.
#
# `workspaceRoot` is intentionally omitted. The plugin then uses the Agent's
# working directory and auto-discovers the .xcworkspace/.xcodeproj there, which
# is the right behaviour for a per-workspace plugin. Set it to an absolute path
# to pin every build to one checkout regardless of the Agent's cwd.
- insert:
    - id: ios-dev-helper
      name: ios-dev-helper
      config:
        # Absolute path to the Xcode CLI tools if they are not on PATH.
        xcodebuildPath: xcodebuild
        xcrunPath: xcrun
        # One xcodebuild invocation may legitimately take many minutes.
        buildTimeoutMs: 900000
        simctlTimeoutMs: 120000
        # Per-stream in-memory output budget before the collector spills to disk.
        maxOutputBytes: 8388608
        # How much diagnostic detail reaches the model.
        maxDiagnostics: 40
        maxOutputChars: 6000
        # SIGTERM -> SIGKILL grace period for a managed child.
        graceMs: 3000
        # The SwiftUI / Human Interface Guidelines system-prompt section.
        injectSwiftUIGuidance: true
        # This project's CI treats compiler warnings as failures. Set to false to
        # let xcode_build report a warning-only build as ok.
        treatWarningsAsErrors: true
